services:
  attendance-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-app-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/attendance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
    volumes:
      - attendance-h2-data:/data
    restart: unless-stopped

volumes:
  attendance-h2-data:


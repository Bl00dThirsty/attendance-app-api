services:
  attendance-db:
    image: postgres:16-alpine
    container_name: attendance-db
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
    volumes:
      - attendance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-cale-auth-service:latest}
    container_name: cale-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-cale-auth-service}
      APP_JWT_AUDIENCE: ${APP_JWT_AUDIENCE:-attendance-app-api}
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:?APP_SECURITY_CORS_ALLOWED_ORIGINS must be set}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@erp.local}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  attendance-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-app-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://attendance-db:5432/attendance_db
      SPRING_DATASOURCE_USERNAME: attendance_user
      SPRING_DATASOURCE_PASSWORD: attendance_pass
      APP_SECURITY_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      APP_SECURITY_JWT_ISSUER: ${APP_JWT_ISSUER:-cale-auth-service}
      APP_SECURITY_JWT_AUDIENCE: ${APP_JWT_AUDIENCE:-attendance-app-api}
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:?APP_SECURITY_CORS_ALLOWED_ORIGINS must be set}
      APP_SECURITY_CORS_ALLOWED_METHODS: ${APP_SECURITY_CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      APP_SECURITY_CORS_ALLOWED_HEADERS: ${APP_SECURITY_CORS_ALLOWED_HEADERS:-Authorization,Content-Type,Accept,Origin}
      APP_SECURITY_CORS_EXPOSED_HEADERS: ${APP_SECURITY_CORS_EXPOSED_HEADERS:-Authorization}
      APP_SECURITY_CORS_ALLOW_CREDENTIALS: ${APP_SECURITY_CORS_ALLOW_CREDENTIALS:-true}
      APP_SECURITY_CORS_MAX_AGE_SECONDS: ${APP_SECURITY_CORS_MAX_AGE_SECONDS:-3600}
      APP_SECURITY_CORS_ENFORCE_SECURE_POLICY: ${APP_SECURITY_CORS_ENFORCE_SECURE_POLICY:-true}
      APP_ATTENDANCE_RULES_MAX_RETROACTIVE_MINUTES: ${APP_ATTENDANCE_RULES_MAX_RETROACTIVE_MINUTES:-720}
      APP_ATTENDANCE_RULES_MAX_FUTURE_TOLERANCE_SECONDS: ${APP_ATTENDANCE_RULES_MAX_FUTURE_TOLERANCE_SECONDS:-0}
      APP_ATTENDANCE_RULES_DUPLICATE_GUARD_ENABLED: ${APP_ATTENDANCE_RULES_DUPLICATE_GUARD_ENABLED:-true}
      APP_ATTENDANCE_RULES_SINGLE_CHECK_IN_PER_DAY: ${APP_ATTENDANCE_RULES_SINGLE_CHECK_IN_PER_DAY:-true}
      APP_ATTENDANCE_RULES_MIN_MINUTES_BETWEEN_CHECK_INS: ${APP_ATTENDANCE_RULES_MIN_MINUTES_BETWEEN_CHECK_INS:-0}
      APP_ATTENDANCE_RULES_ENFORCE_DAILY_WINDOW: ${APP_ATTENDANCE_RULES_ENFORCE_DAILY_WINDOW:-true}
      APP_ATTENDANCE_RULES_DAILY_WINDOW_START: ${APP_ATTENDANCE_RULES_DAILY_WINDOW_START:-04:00}
      APP_ATTENDANCE_RULES_DAILY_WINDOW_END: ${APP_ATTENDANCE_RULES_DAILY_WINDOW_END:-23:00}
    depends_on:
      attendance-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

volumes:
  attendance-postgres-data:
  auth-postgres-data:

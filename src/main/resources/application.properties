spring.application.name=attendance-app
spring.profiles.default=dev
spring.jpa.open-in-view=false

app.observability.environment=${APP_OBSERVABILITY_ENVIRONMENT:dev}
app.observability.http-access-log-enabled=${APP_OBSERVABILITY_HTTP_ACCESS_LOG_ENABLED:true}
app.observability.logs.level.root=${APP_OBSERVABILITY_LOG_LEVEL_ROOT:INFO}
app.observability.logs.level.app=${APP_OBSERVABILITY_LOG_LEVEL_APP:INFO}
app.observability.logs.level.spring=${APP_OBSERVABILITY_LOG_LEVEL_SPRING:INFO}
app.observability.logs.level.hibernate=${APP_OBSERVABILITY_LOG_LEVEL_HIBERNATE:WARN}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.metrics.tags.service=${spring.application.name}
management.metrics.tags.environment=${app.observability.environment}
management.observations.key-values.service=${spring.application.name}
management.observations.key-values.environment=${app.observability.environment}
management.tracing.enabled=${APP_OBSERVABILITY_TRACING_ENABLED:true}
management.tracing.sampling.probability=${APP_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${APP_OBSERVABILITY_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.transport=http/protobuf

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

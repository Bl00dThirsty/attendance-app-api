spring.datasource.url=jdbc:h2:mem:attendance_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

app.security.jwt.secret=YXR0ZW5kYW5jZS10ZXN0LXNlY3JldC1rZXktMzItYnl0ZXM=
app.security.jwt.issuer=cale-auth-service
app.security.jwt.audience=attendance-app-api
app.security.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=Authorization,Content-Type,Accept,Origin
app.security.cors.exposed-headers=Authorization
app.security.cors.allow-credentials=true
app.security.cors.max-age-seconds=3600
app.security.cors.enforce-secure-policy=false
app.attendance.rules.max-retroactive-minutes=1440
app.attendance.rules.max-future-tolerance-seconds=60
app.attendance.rules.duplicate-guard-enabled=true
app.attendance.rules.single-check-in-per-day=true
app.attendance.rules.min-minutes-between-check-ins=0
app.attendance.rules.enforce-daily-window=false
app.attendance.rules.daily-window-start=04:00
app.attendance.rules.daily-window-end=23:00

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-disabled=true

spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

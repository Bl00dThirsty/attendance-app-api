spring.datasource.url=jdbc:h2:mem:attendance_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:ZXJwLWF0dGVuZGFuY2UtZGV2LXNlY3JldC1rZXktMzItYnl0ZXM=}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-disabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

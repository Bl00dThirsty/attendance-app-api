spring.datasource.url=jdbc:h2:mem:attendance_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:ZXJwLWF0dGVuZGFuY2UtZGV2LXNlY3JldC1rZXktMzItYnl0ZXM=}
app.security.jwt.issuer=${APP_SECURITY_JWT_ISSUER:cale-auth-service}
app.security.jwt.audience=${APP_SECURITY_JWT_AUDIENCE:attendance-app-api}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.security.cors.allowed-methods=${APP_SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.security.cors.allowed-headers=${APP_SECURITY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin}
app.security.cors.exposed-headers=${APP_SECURITY_CORS_EXPOSED_HEADERS:Authorization}
app.security.cors.allow-credentials=${APP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
app.security.cors.max-age-seconds=${APP_SECURITY_CORS_MAX_AGE_SECONDS:3600}
app.security.cors.enforce-secure-policy=${APP_SECURITY_CORS_ENFORCE_SECURE_POLICY:false}
app.attendance.rules.max-retroactive-minutes=${APP_ATTENDANCE_RULES_MAX_RETROACTIVE_MINUTES:1440}
app.attendance.rules.max-future-tolerance-seconds=${APP_ATTENDANCE_RULES_MAX_FUTURE_TOLERANCE_SECONDS:60}
app.attendance.rules.duplicate-guard-enabled=${APP_ATTENDANCE_RULES_DUPLICATE_GUARD_ENABLED:true}
app.attendance.rules.single-check-in-per-day=${APP_ATTENDANCE_RULES_SINGLE_CHECK_IN_PER_DAY:true}
app.attendance.rules.min-minutes-between-check-ins=${APP_ATTENDANCE_RULES_MIN_MINUTES_BETWEEN_CHECK_INS:0}
app.attendance.rules.enforce-daily-window=${APP_ATTENDANCE_RULES_ENFORCE_DAILY_WINDOW:false}
app.attendance.rules.daily-window-start=${APP_ATTENDANCE_RULES_DAILY_WINDOW_START:04:00}
app.attendance.rules.daily-window-end=${APP_ATTENDANCE_RULES_DAILY_WINDOW_END:23:00}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-disabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
app.observability.environment=dev
management.tracing.sampling.probability=${APP_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${APP_OBSERVABILITY_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

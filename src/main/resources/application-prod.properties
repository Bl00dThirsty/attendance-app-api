spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS}
app.security.cors.allowed-methods=${APP_SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.security.cors.allowed-headers=${APP_SECURITY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin}
app.security.cors.exposed-headers=${APP_SECURITY_CORS_EXPOSED_HEADERS:Authorization}
app.security.cors.allow-credentials=${APP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
app.security.cors.max-age-seconds=${APP_SECURITY_CORS_MAX_AGE_SECONDS:3600}
app.security.cors.enforce-secure-policy=${APP_SECURITY_CORS_ENFORCE_SECURE_POLICY:true}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-disabled=true
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.jwt.issuer=${APP_SECURITY_JWT_ISSUER:cale-auth-service}
app.security.jwt.audience=${APP_SECURITY_JWT_AUDIENCE:attendance-app-api}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS}
app.security.cors.allowed-methods=${APP_SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.security.cors.allowed-headers=${APP_SECURITY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin}
app.security.cors.exposed-headers=${APP_SECURITY_CORS_EXPOSED_HEADERS:Authorization}
app.security.cors.allow-credentials=${APP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
app.security.cors.max-age-seconds=${APP_SECURITY_CORS_MAX_AGE_SECONDS:3600}
app.security.cors.enforce-secure-policy=${APP_SECURITY_CORS_ENFORCE_SECURE_POLICY:true}
app.attendance.rules.max-retroactive-minutes=${APP_ATTENDANCE_RULES_MAX_RETROACTIVE_MINUTES:720}
app.attendance.rules.max-future-tolerance-seconds=${APP_ATTENDANCE_RULES_MAX_FUTURE_TOLERANCE_SECONDS:0}
app.attendance.rules.duplicate-guard-enabled=${APP_ATTENDANCE_RULES_DUPLICATE_GUARD_ENABLED:true}
app.attendance.rules.single-check-in-per-day=${APP_ATTENDANCE_RULES_SINGLE_CHECK_IN_PER_DAY:true}
app.attendance.rules.min-minutes-between-check-ins=${APP_ATTENDANCE_RULES_MIN_MINUTES_BETWEEN_CHECK_INS:0}
app.attendance.rules.enforce-daily-window=${APP_ATTENDANCE_RULES_ENFORCE_DAILY_WINDOW:true}
app.attendance.rules.daily-window-start=${APP_ATTENDANCE_RULES_DAILY_WINDOW_START:04:00}
app.attendance.rules.daily-window-end=${APP_ATTENDANCE_RULES_DAILY_WINDOW_END:23:00}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-disabled=true
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
